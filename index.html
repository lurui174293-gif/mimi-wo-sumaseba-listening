<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#192b32"><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><title>侧耳倾听 · 日语跟读</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans CJK SC",sans-serif;color:#20343c;background:#f5f1e8}*{box-sizing:border-box}body{margin:0}.hero{background:#192b32;color:#fff;padding:26px 20px 32px}.wrap{max-width:760px;margin:auto}h1{font-family:serif;letter-spacing:.08em;font-size:34px;margin:8px 0}h1 small{display:block;font:12px sans-serif;letter-spacing:.24em;color:#bbd0cb;margin-bottom:7px}.lead{color:#c7d5d1;font-size:14px;line-height:1.7;margin:0}.parts{display:flex;gap:8px;overflow:auto;padding:18px 20px;background:#e8e1d5;scrollbar-width:none}.parts button{flex:0 0 auto;border:1px solid #bec6c1;background:#fff;border-radius:99px;padding:10px 15px;color:#29414a;font-weight:650}.parts button.active{background:#c5694c;color:white;border-color:#c5694c}main{padding:18px 18px 100px}#list{padding-bottom:60vh}.player{background:white;border:1px solid #e3ded4;box-shadow:0 10px 30px #223a3710;border-radius:18px;padding:20px;position:sticky;top:8px;z-index:2}.eyebrow{font-size:11px;letter-spacing:.18em;color:#a75b43;font-weight:bold}.player h2{margin:7px 0 16px;font:22px serif}audio{width:100%}.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}.controls button,.controls select{border:1px solid #d5d8d2;border-radius:9px;background:#f7f8f5;padding:8px 10px;color:#344b51}.controls .skip{background:#d87955;color:#fff;border:0}.hint{font-size:12px;color:#7c8988;margin:12px 0 0;line-height:1.5}.listhead{display:flex;justify-content:space-between;align-items:center;margin:26px 3px 10px}.listhead h2{font:20px serif;margin:0}.listhead span{font-size:12px;color:#7c8988}.cue{width:100%;text-align:left;display:block;border:1px solid #e3ded4;background:#fff;border-radius:13px;padding:15px 16px;margin:8px 0;color:#20343c}.cue.active{border-color:#c5694c;background:#fffaf5;box-shadow:0 0 0 2px #c5694c22}.time{font-size:11px;color:#a07464;display:block;margin-bottom:7px}.ja{display:block;font-size:18px;line-height:1.7}.zh{display:block;font-size:14px;color:#64777c;margin-top:4px}.missing{color:#9aaba9;font-size:12px}.grammar{margin-top:11px;border-top:1px solid #eaded4;padding-top:10px;font-size:13px;color:#44575c;line-height:1.65}.grammar strong{color:#a75b43}.note{padding:14px 16px;border-left:3px solid #c5694c;background:#eee8dc;color:#66767a;font-size:13px;line-height:1.6;border-radius:4px}ruby rt{font-size:.52em;color:#b56b50} @media(max-width:600px){.player{padding:12px}.player h2{font-size:16px;margin:4px 0 8px}.controls{margin-top:6px}.hint{display:none}} @media(min-width:800px){.hero{padding-top:45px}.parts{justify-content:center}.player{top:18px}}
@media(max-width:600px){main{padding-bottom:12px}#list{height:58dvh;overflow-y:auto;overscroll-behavior:contain;overflow-anchor:none;-webkit-overflow-scrolling:touch;padding:25dvh 0 30dvh;scrollbar-width:none}#list::-webkit-scrollbar{display:none}}</style></head><body><header class="hero"><div class="wrap"><h1><small>JAPANESE LISTENING STUDIO</small>侧耳倾听</h1><p class="lead">一段一段听懂日语。点字幕可跳转音频并查看句型；播放时自动跟随高亮。</p></div></header><nav class="parts" id="parts" aria-label="选择片段"></nav><main class="wrap"><section class="player"><div class="eyebrow" id="partlabel"></div><h2 id="parttitle"></h2><audio id="audio" controls playsinline preload="metadata"></audio><div class="controls"><button id="back">↶ 5 秒</button><button id="forward">5 秒 ↷</button><button id="skip" class="skip">跳过片头曲</button><label>速度 <select id="rate"><option value="0.75">0.75×</option><option value="0.9">0.9×</option><option value="1" selected>1×</option><option value="1.15">1.15×</option><option value="1.25">1.25×</option></select></label></div><p class="hint">iPhone 上点播放后，音频会保持在当前片段。切换片段会记住上次进度。</p></section><div class="listhead"><h2>逐句字幕</h2><span id="count"></span></div><p class="note">字幕来自自动转写，部分句子与时间轴可能有误。中文经过一轮校对；转写不清处已标记，仍可能有遗漏。假名为自动注音。</p><div id="list"></div></main><script>
const $=id=>document.getElementById(id), audio=$('audio');let parts=[],index=0,active=-1,opened=-1;const fmt=t=>`${Math.floor(t/60).toString().padStart(2,'0')}:${Math.floor(t%60).toString().padStart(2,'0')}`;
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const readings={'方':'ほう','何':'なに','今日':'きょう','疲':'つか','母':'かあ','父':'とう','夏季集中講座':'かきしゅうちゅうこうざ','出勤':'しゅっきん','雫':'しずく','少':'すこ','片付':'かたづ','晩':'ばん','飯':'はん','支度':'したく','大変':'たいへん','応援':'おうえん','決':'き','帰':'かえ','私':'わたし'};
function ruby(s){let keys=Object.keys(readings).sort((a,b)=>b.length-a.length),re=new RegExp(keys.join('|'),'g');return esc(s).replace(re,x=>`<ruby>${x}<rt>${readings[x]}</rt></ruby>`)}
function render(){let p=parts[index];$('parts').innerHTML=parts.map((x,i)=>`<button class="${i===index?'active':''}" data-part="${i}">第 ${i+1} 段 · ${fmt(x.duration)}</button>`).join('');$('partlabel').textContent=`PART ${String(index+1).padStart(2,'0')} / ${parts.length}`;$('parttitle').textContent=`${fmt(p.start)} — ${fmt(p.start+p.duration)}`;$('count').textContent=`${p.cues.length} 句`;audio.src=p.file;audio.load();audio.playbackRate=Number($('rate').value);$('skip').style.display=index===0?'':'none';$('list').innerHTML=p.cues.map((c,i)=>`<button class="cue" data-cue="${i}"><span class="time">${fmt(c.s)}</span><span class="ja" lang="ja">${c.ruby||esc(c.ja)}</span><span class="zh ${c.raw_ja||!c.zh?'missing':''}">${c.zh?esc(c.zh):'原字幕无法翻译 · 点击可跳转播放'}</span><span class="grammar" hidden></span></button>`).join('');active=-1;opened=-1;let saved=Number(localStorage.getItem('mimi-'+index)||0);audio.addEventListener('loadedmetadata',()=>{if(saved>0&&saved<audio.duration-2)audio.currentTime=saved},{once:true});}
function switchPart(i){localStorage.setItem('mimi-part',i);index=i;lastProgressSave=-10;render();window.scrollTo({top:0,behavior:'smooth'})}
$('parts').onclick=e=>{let b=e.target.closest('[data-part]');if(b)switchPart(Number(b.dataset.part))};$('list').onclick=e=>{let b=e.target.closest('[data-cue]');if(!b)return;let i=Number(b.dataset.cue),c=parts[index].cues[i];audio.currentTime=c.s;audio.play().catch(()=>{});if(opened>=0){let old=$('list').children[opened].querySelector('.grammar');old.hidden=true}if(opened===i){opened=-1;return}opened=i;let box=b.querySelector('.grammar');box.hidden=false;box.innerHTML=c.grammar.length?c.grammar.map(g=>`<strong>${esc(g.name)}</strong> · ${esc(g.body)}`).join('<br>'):'这句暂无已校对的语法注释。';requestAnimationFrame(()=>centerCue(i))};
function centerCue(i,behavior='smooth'){
  if(i<0)return;
  const el=$('list').children[i];if(!el)return;
  const rect=el.getBoundingClientRect();
  const pane=$('list');
  if(window.matchMedia('(max-width:600px)').matches){
    const box=pane.getBoundingClientRect();
    pane.scrollTo({top:pane.scrollTop+rect.top+rect.height/2-(box.top+box.height/2),behavior});
    return;
  }
  const root=document.scrollingElement||document.documentElement;
  root.scrollTop+=rect.top+rect.height/2-window.innerHeight/2;
}
let lastProgressSave=-10;
function syncCue(){
  if(!parts.length)return;
  const t=audio.currentTime,c=parts[index].cues;
  if(t<lastProgressSave||t-lastProgressSave>2){localStorage.setItem('mimi-'+index,t);lastProgressSave=t}
  let lo=0,hi=c.length;
  while(lo<hi){let mid=(lo+hi)>>1;if(c[mid].s<=t)lo=mid+1;else hi=mid}
  const i=lo-1;
  if(i!==active){
    if(active>=0)$('list').children[active]?.classList.remove('active');
    active=i;
    if(i>=0){$('list').children[i].classList.add('active');centerCue(i)}
  }
}
let followTimer;audio.ontimeupdate=syncCue;audio.onseeked=()=>{syncCue();centerCue(active)};audio.onplay=()=>{clearInterval(followTimer);syncCue();centerCue(active);if(window.matchMedia('(max-width:600px)').matches)requestAnimationFrame(()=>$('list').scrollIntoView({behavior:'smooth',block:'center'}));followTimer=setInterval(syncCue,200)};audio.onpause=()=>clearInterval(followTimer);audio.onended=()=>{if(index<parts.length-1)switchPart(index+1)};$('back').onclick=()=>audio.currentTime=Math.max(0,audio.currentTime-5);$('forward').onclick=()=>audio.currentTime=Math.min(audio.duration,audio.currentTime+5);$('skip').onclick=()=>{audio.currentTime=750;audio.play().catch(()=>{})};$('rate').onchange=e=>audio.playbackRate=Number(e.target.value);
function init(x){parts=x;index=Math.min(Number(localStorage.getItem('mimi-part')||0),x.length-1);render()}
</script><script src="data.js?v=3"></script><script src="offline.js"></script></body></html>
